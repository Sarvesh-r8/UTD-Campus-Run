<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="UTD Campus EMS location drills: name and find campus buildings, lots and apartment phases.">
<link rel="icon" href="ems-logo.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UTD Campus Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: dispatch console. Left rail = call card + controls, right = the campus map, full height. Stacks on phones. */
:root{
  --bg:#EEF2EF; --panel:#FFFFFF; --ink:#16231C; --muted:#56685D; --line:#D2DCD5;
  --ems:#00339C; --ems-ink:#FFFFFF; --alert:#D2381F; --ok:#1E8A4C; --warn:#B7791F; --chip:#E1E9E3;
  --map-bg:#F7F7F5; --stripe:#E46F25; --brand:#2D5F3C;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --panel:#16221B; --ink:#E6EEE9; --muted:#97AA9E; --line:#26372D;
  --ems:#7FA2F0; --ems-ink:#07122A; --alert:#FF6A4D; --ok:#43C27C; --warn:#E3AC4A; --chip:#1D2C23;
  --map-bg:#1B2620; --stripe:#F08A4B; --brand:#5FAE7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --panel:#16221B; --ink:#E6EEE9; --muted:#97AA9E; --line:#26372D;
  --ems:#7FA2F0; --ems-ink:#07122A; --alert:#FF6A4D; --ok:#43C27C; --warn:#E3AC4A; --chip:#1D2C23;
  --map-bg:#1B2620; --stripe:#F08A4B; --brand:#5FAE7E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ems);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;height:100%;min-height:560px}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:64px;height:auto;flex:none;max-width:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.livery{flex:none;height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--stripe) 0 10px,var(--brand) 10px 20px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.eyebrow{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);margin:0 0 8px}
.seg{display:grid;gap:6px}
.seg.three{grid-template-columns:repeat(3,1fr)} .seg.two{grid-template-columns:repeat(2,1fr)}
.opt{border:1.5px solid var(--line);background:transparent;border-radius:9px;padding:8px 10px;text-align:left;min-width:0}
.opt b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.opt span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--ems);background:color-mix(in srgb,var(--ems) 10%,transparent)}
.btn{border:0;border-radius:9px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;background:var(--chip)}
.btn.primary{background:var(--ems);color:var(--ems-ink)}
.brand h1{color:var(--brand)}
.btn.danger{background:var(--alert);color:#fff}
.btn.small{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.callcard{border-left:6px solid var(--brand)}
.callhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.callno{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud div{background:var(--chip);border-radius:8px;padding:6px 8px}
.hud small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hud b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.feedback{border-radius:9px;padding:10px 12px;font-size:14px}
.feedback.good{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok)}
.feedback.bad{background:color-mix(in srgb,var(--alert) 12%,transparent);border:1px solid var(--alert)}
.feedback.mid{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn)}
.feedback h3{margin:0 0 2px;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.pts{font-family:var(--f-mono);font-weight:700}
.mapwrap{position:relative;min-width:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none}
#viewport.drawing{cursor:crosshair}
#stage{position:absolute;left:0;top:0;width:1545px;height:2000px;transform-origin:0 0}
#stage img{position:absolute;inset:0;width:1545px;height:2000px;max-width:none;pointer-events:none;-webkit-user-drag:none}
#overlay{position:absolute;inset:0;width:1545px;height:2000px;overflow:visible}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-display);font-weight:700;font-size:20px}
.mapctl button[aria-pressed="true"]{background:var(--ems);color:var(--ems-ink);border-color:var(--ems)}
.maptag{position:absolute;left:10px;top:10px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted);max-width:calc(100% - 80px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.lb-row td:first-child{width:28px;font-family:var(--f-mono);color:var(--muted)}
.lb-me{background:color-mix(in srgb,var(--ems) 10%,transparent)}
.avatar{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted)}
.misslist{margin:6px 0 0;padding-left:18px;font-size:13px}
.misslist li{margin:2px 0}
code{font-family:var(--f-mono);font-size:.92em;background:var(--chip);padding:0 4px;border-radius:4px}
@keyframes pulse{0%{r:14;opacity:1}100%{r:44;opacity:0}}
.pulse{animation:pulse 1.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(440px,62vh);height:auto}
  .rail{overflow:visible;order:1}
  .mapwrap{order:2;height:62vh;min-height:440px}
  body.playing .mapwrap{height:56vh;min-height:360px}
  body.playing .brand, body.playing .livery{display:none}
  body.playing .rail{gap:8px}
  .prompt{font-size:22px}
}
</style>
</head>
<body>

<div class="app">
  <section class="rail" id="rail" aria-live="polite"></section>
  <section class="mapwrap" aria-label="UTD campus map">
    <div id="viewport">
      <div id="stage">
        <img id="mapimg" src="map-blank.jpg" alt="UTD campus map" width="1545" height="2000">
        <svg id="overlay" viewBox="0 0 1545 2000"></svg>
      </div>
    </div>
    <div class="maptag" id="maptag">Scroll or pinch to zoom · drag to move</div>
    <div class="mapctl">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zfit" title="Fit whole campus" aria-label="Fit whole campus" style="font-size:13px">FIT</button>
      <button id="panbtn" title="Move the map instead of drawing" aria-label="Move map mode" aria-pressed="false" hidden style="font-size:12px">MOVE</button>
    </div>
  </section>
</div>

function dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1]);}

      if(ea.e===eb.e) out.push([T,Math.abs(ea.t-eb.t)*EA.len]);}

/* ---------- question generation ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickLoc(diff,used){const cats=DIFFS[diff].cats;for(let k=0;k<200;k++){const c=cats[Math.floor(Math.random()*cats.length)];const pool=LOCS.filter(l=>l.cat===c&&!used.has(gkey(l)));if(pool.length){const l=pool[Math.floor(Math.random()*pool.length)];used.add(gkey(l));return l;}}return LOCS[0];}

  let kinds; if(mode==="shift") kinds=shuffle(["name","name","name","name","name","find","find","find","find","find"]); else kinds=new Array(SHIFT_LEN).fill(mode);
  for(const k of kinds){
    if(k==="route"){let a,b,sp;for(let t=0;t<60;t++){a=pickLoc(diff,new Set(used));b=pickLoc(diff,new Set(used));if(gkey(a)===gkey(b))continue;sp=shortest(a,b);if(sp.len>320&&sp.len<1500)break;}
      used.add(gkey(b)); qs.push({kind:"route",from:a,to:b,best:sp});}

function hintText(l){ if(l.cat==="phase") return `A University Village apartment phase. Its buildings are numbered ${phaseRange(l.ph)}.`; if(l.cat==="apt") return `It's in Phase ${l.ph} of University Village.`; const n=l.name||l.label; return `${CATS[l.cat].name.replace(/s$/,"")} · starts with “${n[0]}”, ${l.label.length} characters in the code.`;}

  G.score+=pts; G.results.push({kind:"find",loc:l,ok,pts,secs});
  clearOverlay(); mapimg.src="map-labeled.jpg";
  LOCS.filter(o=>gkey(o)===gkey(l)).forEach(o=>ring(o,ok?"#1E8A4C":"#D2381F",!ok));
  svgEl("circle",{cx:m[0],cy:m[1],r:9,fill:ok?"#1E8A4C":"#D2381F",stroke:"#fff","stroke-width":3});
  if(!ok){const tgt=LOCS.filter(o=>gkey(o)===gkey(l)).sort((a,b)=>dist(m,[a.x,a.y])-dist(m,[b.x,b.y]))[0];focusBox([m,[tgt.x,tgt.y]],160);}
  revealFeedback(ok,ok?"On target":"Missed",ok?`${esc(l.label)}${extra(l)}`:`${esc(l.label)} is the ring. ${near&&nd<70?`You tapped ${esc(near.label)}.`:"You tapped open ground."}`,pts,parts);
}
/* ---- route drawing ---- */
function beginDraw(m){const Q=q(),tol=Math.max(45,28/V.s);
  if(G.path.length===0){ if(dist(m,[Q.from.x,Q.from.y])>tol){flashTag("Start your line on A");return false;} G.path=[[Q.from.x,Q.from.y],m]; }
  else { const end=G.path[G.path.length-1]; if(dist(m,end)>tol){flashTag("Continue from the end of your line");return false;} G.path.push(m); }
  G.liveLine.setAttribute("points",ptsAttr(G.path)); return true;}
function extendDraw(m){const last=G.path[G.path.length-1];if(dist(m,last)>3/V.s){G.path.push(m);G.liveLine.setAttribute("points",ptsAttr(G.path));}}
function endDrawStroke(check){ if(!check||G.answered)return; const Q=q(),end=G.path[G.path.length-1];
  const targets=LOCS.filter(o=>gkey(o)===gkey(Q.to));
  if(targets.some(t=>dist(end,[t.x,t.y])<Math.max(45,26/V.s))) gradeRoute(); }
function flashTag(t){setTag(t);clearTimeout(flashTag.t);flashTag.t=setTimeout(()=>setTag("Drag from A along the roads"),1800);}
function gradeRoute(){const Q=q(),D=DIFFS[G.diff],secs=elapsed();G.answered=true;
  const best=Q.best, pl=polyLen(G.path);
  const samples=[];for(let i=1;i<G.path.length;i++){const a=G.path[i-1],b=G.path[i],n=Math.ceil(dist(a,b)/8);for(let k=0;k<n;k++)samples.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}
  const spurA=[[Q.from.x,Q.from.y],best.pts[1]], spurB=[best.pts[best.pts.length-2],[Q.to.x,Q.to.y]];
  let on=0;for(const p of samples){ if(distToRoads(p)<24||distToPoly(p,spurA)<30||distToPoly(p,spurB)<30||dist(p,[Q.from.x,Q.from.y])<50||dist(p,[Q.to.x,Q.to.y])<50) on++; }
  const onRoad=samples.length?on/samples.length:0;
  let follow=0;for(const p of samples) if(distToPoly(p,best.pts)<30) follow++; const match=samples.length?follow/samples.length:0;
  const eff=Math.min(1,best.len/Math.max(pl,1));
  const acc=Math.max(0,Math.min(1,eff*onRoad));
  const base=ROUTE_BASE*D.mult*acc;
  const sp=acc>=0.75?Math.round(ROUTE_BASE*D.mult*0.4*Math.max(0,1-secs/30)):0;
  const ok=acc>=0.75; if(ok)G.streak++;else G.streak=0; const st=ok?streakBonus():0;
  const pts=Math.round(base)+sp+st;
  G.score+=pts; G.results.push({kind:"route",from:Q.from,to:Q.to,ok,pts,acc,secs});
  svgEl("polyline",{points:ptsAttr(best.pts),fill:"none",stroke:"#1E8A4C","stroke-width":7,"stroke-dasharray":"16 10","stroke-linecap":"round"});
  if(!DIFFS[G.diff].pinDest) pin(Q.to,"#D2381F","B");
  mapimg.src="map-labeled.jpg";
  const verdict=acc>=0.9?"Optimal route":acc>=0.75?"Good route":acc>=0.5?"Long way around":"Off the roads";
  const ft=v=>fmt(v*FT_PER_PX)+" ft";
  const eta=s=>{const t=s*FT_PER_PX/22;return t<60?Math.round(t)+" s":Math.floor(t/60)+" min "+Math.round(t%60)+" s";};
  const detail=`Your line ${ft(pl)} · best ${ft(best.len)} (≈${eta(best.len)} at 15 mph). On roads ${Math.round(onRoad*100)}% · matches best ${Math.round(match*100)}%.`;
  revealFeedback(acc>=0.75?true:acc>=0.5?"mid":false,verdict,detail+`<div class="legend" style="margin-top:6px"><span><i style="background:#1F5FD1"></i>Your route</span><span><i style="background:#1E8A4C"></i>Fastest route</span></div>`,pts,[`${Math.round(acc*100)}% of ${fmt(ROUTE_BASE*D.mult)}`,sp?`+${sp} speed`:"",st?`+${st} streak`:""]);
  updateCursor(); panbtn.hidden=true;
}
function skip(){const Q=q();G.answered=true;G.streak=0;
  if(Q.kind==="route"){G.results.push({kind:"route",from:Q.from,to:Q.to,ok:false,pts:0,acc:0,skipped:true});clearOverlay();svgEl("polyline",{points:ptsAttr(Q.best.pts),fill:"none",stroke:"#1E8A4C","stroke-width":7,"stroke-dasharray":"16 10"});pin(Q.from,"#1F5FD1","A");pin(Q.to,"#D2381F","B");mapimg.src="map-labeled.jpg";revealFeedback(false,"Skipped",`Fastest route is ${fmt(Q.best.len*FT_PER_PX)} ft, shown dashed.`,0,[]);}
  else {G.results.push({kind:Q.kind,loc:Q.loc,ok:false,pts:0,skipped:true});clearOverlay();ring(Q.loc,"#D2381F");mapimg.src="map-labeled.jpg";focusOn(Q.loc.x,Q.loc.y,Math.max(V.s,0.6));revealFeedback(false,"Skipped",`${esc(Q.loc.label)}${extra(Q.loc)}`,0,[]);}
  panbtn.hidden=true;updateCursor();}
function revealFeedback(ok,title,html,pts,parts){
  const cls=ok===true?"good":ok==="mid"?"mid":"bad";
  const last=G.i===G.qs.length-1;
  const fb=el(`<div class="feedback ${cls}"><h3>${esc(title)} · <span class="pts">+${fmt(pts)}</span></h3><div>${html}</div>${parts.filter(Boolean).length?`<p class="note" style="margin:4px 0 0">${parts.filter(Boolean).join(" · ")}</p>`:""}
    <div class="row" style="margin-top:10px"><button class="btn primary grow" id="nextbtn">${last?"Finish shift":"Next call"}</button></div></div>`);
  renderPlay(fb); const nb=document.getElementById("nextbtn"); nb.onclick=()=>{ if(last) finish(); else {G.i++;showQ();} }; nb.focus({preventScroll:true});
}

/* ---------- finish & leaderboard ---------- */
async function finish(){clearInterval(tick); if(!G)return home();
  const R=G.results, played=R.length; const byCat={};
  for(const r of R){const c=r.kind==="route"?"route":r.loc.cat;byCat[c]=byCat[c]||{n:0,ok:0,pts:0};byCat[c].n++;if(r.ok)byCat[c].ok++;byCat[c].pts+=r.pts;}
  const misses=R.filter(r=>!r.ok);
  S.screen="done"; document.body.classList.remove("playing"); mapimg.src="map-labeled.jpg"; clearOverlay(); fit(); setTag("Full labeled map");
  const rows=Object.entries(byCat).map(([c,v])=>`<tr><td>${c==="route"?"Routes":CATS[c].name}</td><td class="n">${v.ok}/${v.n}</td><td class="n">${fmt(v.pts)}</td></tr>`).join("");
  const final=Math.round(G.score);
  rail.replaceChildren(el(`<div style="display:contents">${brandHTML()}
    <div class="card callcard"><p class="eyebrow">Shift complete · ${DIFFS[G.diff].name} · ${MODES[G.mode].name}</p>
      <p class="prompt" style="font-size:44px;font-family:var(--f-mono)">${fmt(final)} <span style="font-size:18px;color:var(--muted)">pts</span></p>
      <p class="sub">${R.filter(r=>r.ok).length} of ${played} calls handled cleanly.</p>
      <table style="margin-top:8px"><thead><tr><th>Category</th><th class="n">Right</th><th class="n">Pts</th></tr></thead><tbody>${rows||`<tr><td colspan="3">No calls answered.</td></tr>`}</tbody></table>
      ${misses.length?`<details style="margin-top:10px" open><summary>Review misses (${misses.length})</summary><ul class="misslist">${misses.map(r=>r.kind==="route"?`<li>Route ${esc(r.from.label)} → ${esc(r.to.label)}: ${Math.round((r.acc||0)*100)}% accuracy</li>`:`<li><b>${esc(r.loc.label)}</b>${r.loc.name&&r.loc.name!==r.loc.label?" · "+esc(r.loc.name):""}</li>`).join("")}</ul></details>`:""}
      <p class="note" id="savestate" style="margin-top:8px"></p>
      <div class="row" style="margin-top:8px"><button class="btn primary grow" id="againbtn">Run another shift</button><button class="btn" id="homebtn">Menu</button></div>
    </div>
    <div class="card" id="lbcard"></div></div>`));
  document.getElementById("againbtn").onclick=startShift; document.getElementById("homebtn").onclick=home;
  S.lbTab=G.diff; renderLB();
  const res=await saveScore(G.diff,G.mode,final,played); const ss=document.getElementById("savestate"); if(ss) ss.textContent=res;
  G=null;
}

let DB=null, USER=null, MYID=null, LB={}, lbUnsub=null, lbState="loading";
(async()=>{ try{ if(!window.claude||!window.claude.use){lbState="off";renderLBIfShown();return;}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); DB=db; USER=user;
  if(USER){try{MYID=await USER.id();}catch(e){}}
  if(!DB){lbState="off";renderLBIfShown();return;}
  const timer=setTimeout(()=>{if(lbState==="loading"){lbState="slow";renderLBIfShown();}},10000);
  lbUnsub=DB.collection("scores").onSnapshot(snap=>{clearTimeout(timer);LB={};snap.docs.forEach(d=>{LB[d.id]=d.data();});if(!snap.metadata.fromCache)lbState="ok";else if(lbState==="loading")lbState="ok";renderLBIfShown();},
    err=>{clearTimeout(timer);lbState="off";renderLBIfShown();});
 }catch(e){lbState="off";renderLBIfShown();} })();
function renderLBIfShown(){if(document.getElementById("lbcard"))renderLB();}
async function renderLB(){const card=document.getElementById("lbcard");if(!card)return;const tab=S.lbTab;
  const local=store.get("best",{});
  let body="";
  if(lbState==="off"){body=`<p class="note">Scores are saved in this browser. Your best on ${DIFFS[tab].name}: <b class="pts">${fmt((local[tab]||{}).score||0)}</b></p>`;}
  else if(lbState==="loading"){body=`<p class="note">Loading the team board…</p>`;}
  else{ const rows=Object.entries(LB).filter(([id,v])=>v&&v[tab]&&typeof v[tab].score==="number").map(([id,v])=>({id,...v[tab]})).sort((a,b)=>b.score-a.score).slice(0,25);
    if(!rows.length) body=`<p class="note">No ${DIFFS[tab].name} scores yet. Finish a ${DIFFS[tab].name} shift to claim the top spot.</p>`;
    else{ let ps={}; try{ if(USER) ps=await USER.profiles(rows.map(r=>r.id)); }catch(e){}
      body=`<table><thead><tr><th>#</th><th>Responder</th><th class="n">Best</th></tr></thead><tbody></tbody></table>${lbState==="slow"?`<p class="note">The board may be out of date; still reaching the server.</p>`:""}`;
      setTimeout(()=>{const tb=card.querySelector("tbody");if(!tb)return;rows.forEach((r,i)=>{const p=ps[r.id]||{};const tr=document.createElement("tr");tr.className="lb-row"+(r.id===MYID?" lb-me":"");
        const td1=document.createElement("td");td1.textContent=i+1;const td2=document.createElement("td");
        if(p.avatarUrl){const im=document.createElement("img");im.className="avatar";im.alt="";im.src=p.avatarUrl;td2.appendChild(im);}
        td2.appendChild(document.createTextNode((p.name||"Responder")+(r.id===MYID?" (you)":"")));
        const sm=document.createElement("div");sm.className="note";sm.textContent=`${MODES[r.mode]?MODES[r.mode].name:""} · ${r.shifts||1} shift${(r.shifts||1)>1?"s":""}`;td2.appendChild(sm);
        const td3=document.createElement("td");td3.className="n";td3.textContent=fmt(r.score);tr.append(td1,td2,td3);tb.appendChild(tr);});},0);
    } }
  card.innerHTML=`<p class="eyebrow">Your best scores</p><div class="tabs" role="tablist">${Object.keys(DIFFS).map(d=>`<button role="tab" aria-selected="${d===tab}" data-t="${d}">${DIFFS[d].name}</button>`).join("")}</div>${body}`;
  card.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.lbTab=b.dataset.t;renderLB();});
}
async function saveScore(diff,mode,score,played){
  const local=store.get("best",{}); const prev=(local[diff]||{}).score||0;
  if(score>prev){local[diff]={score,mode};store.set("best",local);}
  if(!DB||!MYID) return score>prev?"New personal best saved on this device.":"";
  try{ const ref=DB.doc("scores/"+MYID); const cur=(await ref.get()).data()||{};
    const old=cur[diff]||{}; const next={...cur}; const shifts=(old.shifts||0)+1;
    if(!old.score||score>old.score) next[diff]={score,mode,shifts,at:new Date().toISOString()}; else next[diff]={...old,shifts};
    await ref.set(next);
    return (!old.score||score>old.score)?"New best! Posted to the team leaderboard.":`Your team-board best stays at ${fmt(old.score)}.`;
  }catch(e){ return e&&e.code==="invalid_argument"?"You can view the board, but your access level can't post scores.":"Couldn't reach the team board; score kept on this device."; }
}

/* ---------- home & study ---------- */
function brandHTML(){return `<header class="brand"><img class="logo" src="ems-logo.png" alt="UTD Campus EMS logo" width="64" height="66"><div><h1>UTD Campus Run</h1><p>UTD Campus EMS · location drills</p></div></header><div class="livery" aria-hidden="true"></div>`;}
function home(){S.screen="home";G=null;clearInterval(tick);document.body.classList.remove("playing");clearOverlay();mapimg.src="map-labeled.jpg";fit();setTag("UTD campus map · updated 02.05.24");panbtn.hidden=true;updateCursor();
  const d=S.diff;
  const ptsRows=Object.entries(CATS).map(([k,c])=>`<tr><td>${c.name}</td>${Object.keys(DIFFS).map(dd=>`<td class="n">${DIFFS[dd].cats.includes(k)?fmt(c.pts*DIFFS[dd].mult):"—"}</td>`).join("")}</tr>`).join("");
  rail.replaceChildren(el(`<div style="display:contents">${brandHTML()}
   <div class="card"><p class="eyebrow">1 · Difficulty</p><div class="seg three">${Object.entries(DIFFS).map(([k,v])=>`<button class="opt" data-d="${k}" aria-pressed="${k===d}"><b>${v.name}</b><span>${v.desc} · ×${v.mult}</span></button>`).join("")}</div>
   <p class="eyebrow" style="margin-top:12px">2 · Drill</p><div class="seg three">${Object.entries(MODES).map(([k,v])=>`<button class="opt" data-m="${k}" aria-pressed="${k===S.mode}"><b>${v.name}</b><span>${v.desc}</span></button>`).join("")}</div>
   <div class="row" style="margin-top:12px"><button class="btn primary grow" id="gobtn">Start shift · ${SHIFT_LEN} calls</button><button class="btn" id="studybtn">Study map</button></div></div>
   <div class="card"><p class="eyebrow">Points per correct answer</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Category</th>${Object.values(DIFFS).map(v=>`<th class="n">${v.name}</th>`).join("")}</tr></thead><tbody>${ptsRows}</tbody></table></div>
    <details style="margin-top:8px"><summary>How scoring works</summary><ul class="misslist">
     <li><b>Name It</b> pays the full category value. <b>Find It</b> pays ${FIND_FACTOR*100}%. A hint halves the value.</li>
     <li><b>Speed bonus:</b> up to +50% for answering fast (within 20 s for Name It, 15 s for Find It).</li>
     <li><b>Streak bonus:</b> +5 from the 3rd clean call in a row, building to +25.</li>
     <li>Codes and full names both count (e.g. <code>SSB</code> or “Student Services Building”). Lots take “Lot T” or “T”. Phases take “Phase 3” or “3”.</li>
     <li>Easy and Medium show apartment building numbers and ask for the <b>phase</b>. Only Hard hides the numbers and asks for the <b>building number</b>.</li></ul></details></div>
   <div class="card" id="lbcard"></div></div>`));
  rail.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;store.set("diff",S.diff);S.lbTab=S.diff;home();});
  rail.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;store.set("mode",S.mode);home();});
  document.getElementById("gobtn").onclick=startShift; document.getElementById("studybtn").onclick=study;
  renderLB();
}
let studyLabels=true, studyPick=null;
function study(){S.screen="study";clearOverlay();mapimg.src=studyLabels?"map-labeled.jpg":"map-blank.jpg";setTag("Tap any location to see its name");
  LOCS.forEach(l=>svgEl("circle",{cx:l.x,cy:l.y,r:5,fill:CATCOL[l.cat],stroke:"#fff","stroke-width":2,opacity:.9}));
  if(studyPick) ring(studyPick,"#1F5FD1");
  const p=studyPick;
  rail.replaceChildren(el(`<div style="display:contents">${brandHTML()}
    <div class="card"><p class="eyebrow">Study map</p>
     ${p?`<p class="prompt">${esc(p.label)}</p><p class="sub">${esc(p.name&&p.name!==p.label?p.name:"Code only on the map")}</p><p class="note" style="margin-top:6px">${CATS[p.cat].name}${p.ph&&p.cat==="apt"?` · Phase ${esc(p.ph)}`:""}${p.cat==="phase"?` · buildings ${phaseRange(p.ph)}`:""} · ${CATS[p.cat].pts} pts base · access from ${esc(edges[ACCESS.get(p.id).e].name)}</p>`:`<p class="sub">Tap a dot on the map to see the code, full name and category.</p>`}
     <div class="row" style="margin-top:10px"><button class="btn small" id="lblbtn">${studyLabels?"Hide labels":"Show labels"}</button><button class="btn small" id="backbtn">Menu</button></div></div>
    <div class="card"><p class="eyebrow">Dot colors</p><div class="legend">${Object.entries(CATS).map(([k,c])=>`<span><i style="background:${CATCOL[k]};height:10px;width:10px;border-radius:50%"></i>${c.name}</span>`).join("")}</div></div></div>`));
  document.getElementById("lblbtn").onclick=()=>{studyLabels=!studyLabels;study();};
  document.getElementById("backbtn").onclick=()=>{studyPick=null;home();};
}
const CATCOL={acad:"#E8731C",res:"#1E8A4C",phase:"#C2185B",ps:"#9A2E14",lot:"#6B7785",field:"#2BA89A",apt:"#7A3FB0"};
function studyTap(m){let near=null,nd=Infinity;for(const o of LOCS){const d=dist(m,[o.x,o.y]);if(d<nd){nd=d;near=o;}} if(near&&nd<60){studyPick=near;study();}}

/* boot */
mapimg.onload=()=>{}; fit(); home();
</script>
